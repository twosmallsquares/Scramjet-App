<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Loop Unblocker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
    }

    /* LEFT MENU */
    #sidebar {
      width: 230px;
      min-width: 230px;
      height: 100%;
      background: #181818;
      border-right: 1px solid #303030;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
    }

    #logo {
      font-size: 20px;
      font-weight: 700;
      padding: 10px 12px 25px;
    }

    .menu-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #aaa;
      text-align: left;
      padding: 13px 14px;
      margin-bottom: 5px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
    }

    .menu-button:hover {
      background: #252525;
      color: white;
    }

    /* MAIN */
    #main {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #error {
      max-width: 600px;
      padding: 30px;
    }

    #number {
      font-size: 110px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -6px;
      margin-bottom: 20px;
    }

    #title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    #message {
      color: #888;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    #homeButton {
      border: 0;
      background: #fff;
      color: #111;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    #homeButton:hover {
      background: #ddd;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- LEFT MENU -->
    <aside id="sidebar">

      <div id="logo">
        Loop Unblocker
      </div>

      <button class="menu-button" onclick="location.href='/index.html'">
        Browsing
      </button>

      <button class="menu-button" onclick="location.href='/g.html'">
        Games
      </button>

      <button class="menu-button" onclick="location.href='/a.html'">
        Anime
      </button>

    </aside>


    <!-- 404 CONTENT -->
    <main id="main">

      <div id="error">

        <div id="number">
          404
        </div>

        <div id="title">
          Page not found
        </div>

        <button id="homeButton" onclick="location.href='/index.html'">
          Back to Home
        </button>

      </div>

    </main>

  </div>

</body>
</html>
