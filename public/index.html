  </div>

  <script>

    /* =========================================
       SCRAMJET SETUP
    ========================================= */

    const { ScramjetController } =
      $scramjetLoadController();

    const scramjet =
      new ScramjetController({
        files: {
          wasm: "/scram/scramjet.wasm.wasm",
          all: "/scram/scramjet.all.js",
          sync: "/scram/scramjet.sync.js"
        }
      });

    scramjet.init();

    const connection =
      new BareMux.BareMuxConnection(
        "/baremux/worker.js"
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const home =
      document.getElementById("home");

    const browser =
      document.getElementById("browser");

    const searchForm =
      document.getElementById("searchForm");

    const searchBox =
      document.getElementById("searchBox");

    const addressBar =
      document.getElementById("addressBar");

    const frameContainer =
      document.getElementById("frameContainer");

    const homeButton =
      document.getElementById("homeButton");

    const backButton =
      document.getElementById("backButton");

    const forwardButton =
      document.getElementById("forwardButton");

    const reloadButton =
      document.getElementById("reloadButton");


    /* =========================================
       VARIABLES
    ========================================= */

    let scramFrame = null;

    let currentUrl = "";


    /* =========================================
       PROXY SETUP
    ========================================= */

    async function setupProxy() {

      if (typeof registerSW === "function") {
        await registerSW();
      }

      const wisp =
        (location.protocol === "https:"
          ? "wss"
          : "ws") +
        "://" +
        location.host +
        "/wisp/";

      if (
        (await connection.getTransport()) !==
        "/libcurl/index.mjs"
      ) {

        await connection.setTransport(
          "/libcurl/index.mjs",
          [
            {
              websocket: wisp
            }
          ]
        );

      }

    }


    /* =========================================
       INPUT → URL
    ========================================= */

    function getUrl(input) {

      input = input.trim();

      if (!input) {
        return null;
      }

      if (
        /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//
          .test(input)
      ) {
        return input;
      }

      if (
        input.includes(".") &&
        !input.includes(" ")
      ) {
        return "https://" + input;
      }

      return (
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(input)
      );

    }


    /* =========================================
       OPEN URL
    ========================================= */

    async function openUrl(input) {

      const url = getUrl(input);

      if (!url) {
        return;
      }

      try {

        await setupProxy();

        if (!scramFrame) {

          scramFrame =
            scramjet.createFrame();

          const iframe =
            scramFrame.frame;

          iframe.classList.add(
            "scram-frame"
          );

          frameContainer.appendChild(
            iframe
          );

        }

        currentUrl = url;

        addressBar.value = url;

        home.style.display = "none";

        browser.style.display = "flex";

        scramFrame.go(url);

      } catch (error) {

        console.error(
          "Failed to open URL:",
          error
        );

      }

    }


    /* =========================================
       HOME SEARCH
    ========================================= */

    searchForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        openUrl(searchBox.value);

      }
    );


    /* =========================================
       ADDRESS BAR
    ========================================= */

    addressBar.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          openUrl(addressBar.value);

        }

      }
    );


    /* =========================================
       HOME BUTTON
    ========================================= */

    homeButton.addEventListener(
      "click",
      function() {

        browser.style.display = "none";

        home.style.display = "flex";

        searchBox.value = "";

        searchBox.focus();

      }
    );


    /* =========================================
       BACK
    ========================================= */

    backButton.addEventListener(
      "click",
      function() {

        if (!scramFrame) {
          return;
        }

        try {

          scramFrame.back();

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================================
       FORWARD
    ========================================= */

    forwardButton.addEventListener(
      "click",
      function() {

        if (!scramFrame) {
          return;
        }

        try {

          scramFrame.forward();

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================================
       REFRESH
    ========================================= */

    reloadButton.addEventListener(
      "click",
      function() {

        if (
          !scramFrame ||
          !currentUrl
        ) {
          return;
        }

        try {

          scramFrame.go(currentUrl);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================================
       START
    ========================================= */

    searchBox.focus();

  </script>
